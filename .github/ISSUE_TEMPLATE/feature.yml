name: New feature
description: Suggest new functionality
title: "[Feature] "
type: Feature
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        **Title:** Keep `[Feature]` at the beginning of the issue title. Do not delete it.

  - type: textarea
    id: overview
    attributes:
      label: Overview of the feature
      description: Briefly describe the new feature.

  - type: textarea
    id: expected-functionality
    attributes:
      label: Expected functionality
      description: Explain how you expect the feature to work.
      placeholder: |
        Example:
        When the user double-presses the ring button, the application should emit a configurable keyboard shortcut.

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add supporting videos, documents, diagrams, links, or any other useful context.
      placeholder: |
        Example:
        The feature should behave as described on page 4 of the XX document.
