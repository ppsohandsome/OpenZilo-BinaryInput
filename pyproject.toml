[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zilo-ring"
version = "0.1.0"
description = "Low-latency Linux BLE IMU viewer for one Zilo ring"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.9,<7",
  "bleak>=3.0.2,<4",
  "bleak-retry-connector>=4.6.1,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zilo_ring.presentation.qt.pages.visualization" = ["*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
